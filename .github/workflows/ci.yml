name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — saves minutes on busy PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # Frozen lockfile: fails rather than silently resolving different
        # versions. Keep package.json and bun.lock committed together.
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx prettier --check .

      - name: Build
        run: bun run build
        env:
          # Build-time only. The AI generator degrades gracefully without it,
          # so this stays empty unless you want to exercise it in CI.
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
